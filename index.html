<div id="auth-container">
  <h3>Espace Voyageur - Connexion</h3>
  <input type="text" id="pin-input" placeholder="Entrez votre PIN à 6 chiffres" maxlength="6">
  <button onclick="verifierPin()">Valider</button>
  <p id="error-msg" style="color: red;"></p>
</div>

<div id="result-container" style="display: none;">
  <h2>Bienvenue <span id="res-prenom"></span> !</h2>
  <p><strong>Cottage :</strong> <span id="res-cottage"></span></p>
  <p><strong>Arrivée :</strong> <span id="res-arrivee"></span></p>
  <p><strong>Départ :</strong> <span id="res-depart"></span></p>
  
  <!-- Zone pour afficher dynamiquement le QR code ou l'image selon le cottage -->
  <div id="cottage-media" style="margin-top: 20px;">
    <!-- L'image ou le QR code s'insérera ici automatiquement -->
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwYeyad7PZLSdW89S4M-smP4xT_szWvH9mrlJQXfSvUud1grLn9f33mpcEBUo6hVkgv/exec";

  async function verifierPin() {
    const pinSaisi = document.getElementById("pin-input").value.trim();
    const errorMsg = document.getElementById("error-msg");
    
    if (pinSaisi.length !== 6) {
      errorMsg.innerText = "Le code PIN doit comporter exactement 6 chiffres.";
      return;
    }
    
    errorMsg.innerText = "Vérification en cours...";

    try {
      let response = await fetch(WEB_APP_URL);
      let data = await response.json();
      
      let voyageur = data.find(item => item.pin === pinSaisi);
      
      if (voyageur) {
        document.getElementById("res-prenom").innerText = voyageur.prenom;
        document.getElementById("res-cottage").innerText = voyageur.cottage;
        document.getElementById("res-arrivee").innerText = voyageur.arrivee;
        document.getElementById("res-depart").innerText = voyageur.depart;
        
        // Gestion dynamique des images / liens PostImage selon le cottage
        const mediaContainer = document.getElementById("cottage-media");
        if (voyageur.cottage.includes("Ptitzabris")) {
          mediaContainer.innerHTML = `
            <p><strong>Votre QR Code / Infos Wi-Fi :</strong></p>
            <img src="${voyageur.qrWifi}" alt="QR Code Wifi Ptitzabris" style="max-width: 200px; border-radius: 8px;">
          `;
        } else {
          mediaContainer.innerHTML = `
            <p><strong>Votre QR Code / Infos Wi-Fi :</strong></p>
            <img src="${voyageur.qrWifi}" alt="QR Code Wifi Grandzabris" style="max-width: 200px; border-radius: 8px;">
          `;
        }
        
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";
      } else {
        errorMsg.innerText = "Code PIN incorrect ou séjour introuvable.";
      }
    } catch (error) {
      console.error("Erreur:", error);
      errorMsg.innerText = "Erreur de connexion avec la base de données.";
    }
  }
</script>
