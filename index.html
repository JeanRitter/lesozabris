<style>
  .oz-auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f9f9f6;
    padding: 20px;
  }
  .oz-card {
    background: #ffffff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 450px;
    text-align: center;
  }
  .oz-card h3, .oz-card h2 {
    color: #2c3e50;
    margin-bottom: 20px;
  }
  .oz-input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 1px solid #dcdde1;
    border-radius: 8px;
    box-sizing: border-box;
    margin-bottom: 15px;
    text-align: center;
    letter-spacing: 2px;
  }
  .oz-btn {
    background-color: #27ae60;
    color: white;
    border: none;
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-weight: bold;
    transition: background 0.2s;
  }
  .oz-btn:hover {
    background-color: #219653;
  }
  .oz-error {
    color: #e74c3c;
    margin-top: 15px;
    font-size: 14px;
  }
  .oz-info-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    padding: 8px 0;
    border-bottom: 1px solid #f1f2f6;
    font-size: 15px;
    color: #555;
  }
  .oz-info-row strong {
    color: #2c3e50;
  }
</style>

<div class="oz-auth-wrapper">
  <div id="auth-container" class="oz-card">
    <h3>🔐 Espace Voyageur</h3>
    <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Entrez votre code PIN à 6 chiffres pour accéder à votre carnet de séjour.</p>
    <input type="text" id="pin-input" class="oz-input" placeholder="• • • • • •" maxlength="6">
    <button onclick="verifierPin()" class="oz-btn">Accéder à mon espace</button>
    <p id="error-msg" class="oz-error"></p>
  </div>

  <div id="result-container" class="oz-card" style="display: none;">
    <h2>Bienvenue <span id="res-prenom" style="color: #27ae60;"></span> !</h2>
    <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">Cottage : <strong id="res-cottage"></strong></p>
    
    <div class="oz-info-row">
      <span>Arrivée :</span>
      <strong id="res-arrivee"></strong>
    </div>
    <div class="oz-info-row">
      <span>Départ :</span>
      <strong id="res-depart"></strong>
    </div>
    
    <div id="cottage-media" style="margin-top: 25px;"></div>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwYeyad7PZLSdW89S4M-smP4xT_szWvH9mrlJQXfSvUud1grLn9f33mpcEBUo6hVkgv/exec";

  async function verifierPin() {
    const pinSaisi = document.getElementById("pin-input").value.trim();
    const errorMsg = document.getElementById("error-msg");
    
    if (pinSaisi.length !== 6) {
      errorMsg.innerText = "Le code PIN doit comporter exactement 6 chiffres.";
      return;
    }
    
    errorMsg.innerText = "Vérification en cours...";

    try {
      let response = await fetch(WEB_APP_URL);
      let data = await response.json();
      
      let voyageur = data.find(item => item.pin === pinSaisi);
      
      if (voyageur) {
        document.getElementById("res-prenom").innerText = voyageur.prenom;
        document.getElementById("res-cottage").innerText = voyageur.cottage;
        document.getElementById("res-arrivee").innerText = voyageur.arrivee;
        document.getElementById("res-depart").innerText = voyageur.depart;
        
        // Affichage dynamique du QR code / image Wi-Fi selon le lien dans le Sheet
        const mediaContainer = document.getElementById("cottage-media");
        if (voyageur.qrWifi) {
          mediaContainer.innerHTML = `
            <p style="font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 10px;">📲 Votre accès Wi-Fi / Infos :</p>
            <img src="${voyageur.qrWifi}" alt="QR Code Wifi" style="max-width: 180px; border-radius: 8px; border: 1px solid #ddd; padding: 5px; background: white;">
          `;
        }
        
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";
      } else {
        errorMsg.innerText = "Code PIN incorrect ou séjour introuvable.";
      }
    } catch (error) {
      console.error("Erreur:", error);
      errorMsg.innerText = "Erreur de connexion avec la base de données.";
    }
  }
</script>
